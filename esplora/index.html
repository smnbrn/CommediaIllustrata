<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Commedia illustrata · Inferno in 3D</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #09060a; overflow: hidden; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #caricamento { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                     color: #e8dcc8; font: 16px/1.4 Georgia, serif; gap: 14px; text-align: center; padding: 0 16px; }
      #barra { width: min(280px, 70vw); height: 6px; background: #2a1d1f; border-radius: 3px; overflow: hidden; }
      #barra > div { height: 100%; width: 0; background: #d9a441; }
      #torna { position: fixed; right: 10px; bottom: 10px; color: #e8dcc8; font: 13px sans-serif; background: rgba(0,0,0,.55);
               padding: 6px 10px; border-radius: 6px; text-decoration: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="caricamento"><div>Discesa in corso…</div><div id="barra"><div id="avanzamento"></div></div></div>
    <a id="torna" href="../index.html">← Torna alla lettura</a>
    <script src="Build/esplora.loader.js"></script>
    <script>
      var avanz = document.getElementById("avanzamento");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/esplora.data.unityweb",
        frameworkUrl: "Build/esplora.framework.js.unityweb",
        codeUrl: "Build/esplora.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "CommediaIllustrata",
        productName: "Inferno 3D",
        productVersion: "1.0",
      }, function (p) { avanz.style.width = (p * 100) + "%"; })
      .then(function () { document.getElementById("caricamento").style.display = "none"; })
      .catch(function (m) { document.getElementById("caricamento").firstChild.textContent = "Errore: " + m; });
    </script>
  </body>
</html>
